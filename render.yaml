services:
  - type: web
    name: bulanci-eu
    runtime: node
    plan: free
    region: frankfurt   # server v Evropě – nižší odezva pro hráče z ČR (region nejde po založení změnit)
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ROUNDS
        value: "5"
      - key: BOTS
        value: "4"
